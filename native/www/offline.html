<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Georgetown Football Alum Network</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #041e42;
        color: #f4f1ea;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: min(42vw, 160px);
        height: auto;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        max-width: 26rem;
        line-height: 1.45;
        color: #d6c7a1;
      }
      button {
        margin-top: 0.5rem;
        border: 1px solid #d6c7a1;
        background: transparent;
        color: #f4f1ea;
        padding: 0.6rem 1.1rem;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="brand/hoya-bulldog.png" alt="Jack the Bulldog" />
      <h1>Can’t reach the network</h1>
      <p>
        The native app loads the live website. Connect to the internet and try
        again.
      </p>
      <button type="button" onclick="window.location.replace('https://georgetown-alum.vercel.app')">
        Retry
      </button>
    </main>
  </body>
</html>
