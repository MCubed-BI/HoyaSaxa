name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx eslint "src/app/(locker)/**/*.{ts,tsx}" "src/app/api/locker/**/*.ts" "src/components/locker-*.tsx" "src/components/newsflash-form.tsx" "src/lib/hoya-alum-session.ts" "src/lib/hoya-alum-session.test.ts" "src/lib/locker-*.ts" src/proxy.ts
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: ""
          COACH_USERNAME: Hoyas
          COACH_PASSWORD: ci-placeholder
